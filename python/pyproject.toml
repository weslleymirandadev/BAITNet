[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipv69"
version = "0.1.0"
description = "IPv69 — a link-layer protocol with 40-bit addresses, Ed25519 identity, ICSP streams and BITE (Python implementation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "see the repo LICENSE" }
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ipv69py = "ipv69.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
