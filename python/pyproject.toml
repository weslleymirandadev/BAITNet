[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baitnet"
version = "0.1.0"
description = "BaitNet — Python implementation of the IPv69 protocol (40-bit addresses, Ed25519 identity, ICSP framing, BITE names)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "see the repo LICENSE" }
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
baitnet = "baitnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
